apiVersion: v1
kind: ConfigMap
metadata:
  name: region-config
data:
  index.html: |
    <html>
      <body style="font-family: sans-serif; text-align: center; padding-top: 100px;">
        <h1>Hello from westus2</h1>
        <p>This pod is running in westus2</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: region-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: region-app
  template:
    metadata:
      labels:
        app: region-app
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: region-config
---
apiVersion: v1
kind: Service
metadata:
  name: region-app-public
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "false"
spec:
  type: LoadBalancer
  selector:
    app: region-app
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: region-app-private
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: region-app
  ports:
    - port: 80
      targetPort: 80
